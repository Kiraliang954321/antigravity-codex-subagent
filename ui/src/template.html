<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Settings</title>
    <style>
      html,body,#app{height:100%;margin:0;padding:0}
      body{background:var(--color-background-primary,#f7f9fc);color:var(--color-text-primary,#141b26);font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif)}
      @media (prefers-color-scheme:dark){body{background:var(--color-background-primary,#0f131a);color:var(--color-text-primary,#e6ecf5)}}
      .boot-skel{max-width:680px;margin:0 auto;padding:24px 20px;box-sizing:border-box}
      .boot-card{border-radius:12px;border:1px solid var(--color-border-primary,rgba(128,145,175,.25));background:var(--color-background-secondary,rgba(128,145,175,.08));padding:18px;display:flex;flex-direction:column;gap:12px}
      .boot-title{font-size:13px;font-weight:700}
      .boot-bar{height:36px;border-radius:8px;background:var(--color-background-tertiary,rgba(128,145,175,.16))}
    </style>
    <!--INLINE_CSS-->
  </head>
  <body>
    <div id="app">
      <div class="boot-skel" aria-busy="true">
        <div class="boot-card">
          <div class="boot-title">Codex Settings</div>
          <div class="boot-bar"></div>
          <div class="boot-bar"></div>
        </div>
      </div>
    </div>
    <!--INLINE_JS-->
  </body>
</html>
