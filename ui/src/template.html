<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Monitor</title>
    <style>
      html,body,#app{height:100%;margin:0;padding:0;overflow:hidden}
      body{background:var(--color-background-primary,#f7f9fc);color:var(--color-text-primary,#141b26);font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif)}
      @media (prefers-color-scheme:dark){body{background:var(--color-background-primary,#0f131a);color:var(--color-text-primary,#e6ecf5)}}
      .boot-skel{display:flex;flex-direction:column;height:100%}
      .boot-bar{height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--color-border-primary,rgba(128,145,175,.22));background:var(--color-background-secondary,rgba(128,145,175,.08));font-size:13px;font-weight:600}
      .boot-dot{width:8px;height:8px;border-radius:3px;background:#3b82f6}
      .boot-body{width:100%;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
      .boot-bubble-r{align-self:flex-end;width:58%;height:68px;border-radius:16px 16px 4px 16px;background:var(--color-background-info,rgba(59,130,246,.14));opacity:.8}
      .boot-bubble-l{width:84%;height:136px;border-radius:16px 16px 16px 4px;background:var(--color-background-secondary,rgba(128,145,175,.14));opacity:.8}
    </style>
    <!--INLINE_CSS-->
  </head>
  <body>
    <div id="app">
      <div class="boot-skel" aria-busy="true">
        <div class="boot-bar"><span class="boot-dot"></span><span>Codex Monitor</span></div>
        <div class="boot-body">
          <div class="boot-bubble-r"></div>
          <div class="boot-bubble-l"></div>
        </div>
      </div>
    </div>
    <!--INLINE_JS-->
  </body>
</html>
